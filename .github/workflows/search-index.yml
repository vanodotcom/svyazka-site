name: Поиск по сайту
on:
  push:
    branches: [main]
    paths: ['p/**', 'scripts/search_index.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency: search-index
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/search_index.py
      - name: Сохранить, если тексты изменились
        run: |
          git add data/search.json
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git config user.name "svyazka-search-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Поиск: обновить тексты страниц"
          git push
