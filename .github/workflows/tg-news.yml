# Робот «Новости из Телеграма»: каждый час (в :17) читает публичный канал t.me/westra
# и пишет 6 свежих постов в news.json; главная показывает три из них.
# Картинки этих трёх новостей скачиваются в img/news/ раз в сутки, старые удаляются.
name: Новости из Телеграма
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: tg-news
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # новые картинки новостей качаем только раз в сутки (в 02 UTC), в остальные часы у новой новости картинка из Телеграма
      - run: if [ "$(date -u +%H)" = "02" ]; then export NEWS_PHOTOS=1; fi; python3 scripts/tg_news.py
      - name: Сохранить, если новости изменились
        run: |
          git add news.json
          git add -A img/news
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git config user.name "svyazka-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Новости из Телеграма"
          git push
