# «Связка»: публикация сайта на GitLab Pages (основной хостинг с 8 ноября 2026).
# Запускается при каждой отправке в ветку main и по расписанию
# (Build → Pipeline schedules, каждый час в :17).
# Перед публикацией «роботы» обновляют данные прямо в копии для сайта,
# в репозиторий ничего не сохраняют (поэтому токены не нужны):
#   news.json        — 6 свежих постов из t.me/westra (scripts/tg_news.py)
#   calendar.ics     — подписка на календарь из листа «События» (scripts/calendar_ics.py)
#   data/search.json — тексты страниц для поиска в меню (scripts/search_index.py)
#   data/passes.json — список перевалов westra.ru, только в запуске около 5 утра по Москве (scripts/passes_index.py)
# Если робот не смог обновить данные (сбой Телеграма, таблицы и т.п.), на сайт уходит прежний файл из репозитория.
pages:
  image: python:3.12-alpine
  script:
    - python3 scripts/tg_news.py || echo "новости не обновились, оставляем прежние"
    - python3 scripts/calendar_ics.py || echo "календарь не обновился, оставляем прежний"
    - python3 scripts/search_index.py || echo "поиск не обновился, оставляем прежний"
    - if [ "$(date -u +%H)" = "02" ]; then python3 scripts/passes_index.py || echo "перевалы не обновились"; fi
    - mkdir public
    # копируем всё, кроме самой папки public
    - for f in *; do if [ "$f" != public ]; then cp -r "$f" public/; fi; done
    - ls public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
