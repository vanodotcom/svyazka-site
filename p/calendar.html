<!-- «Связка»: страница «Календарь» (адрес /calendar/). Вставить в блок T123 «HTML-код», отступы блока 0.
     Что меняется руками, отмечено словом ПРАВИТЬ. -->
<style>
.svp{--ink:#161615;--muted:#57554F;--line:#E6E4DF;--stone:#ECEAE5;--accent:#C8410B;
  font-family:'Onest',system-ui,sans-serif;font-size:16px;line-height:1.5;color:var(--ink);
  box-sizing:border-box;max-width:956px;padding:24px 48px 64px}
.svp *{box-sizing:border-box}
.svp a{color:var(--ink)} .svp a:hover{color:var(--muted)}
.svp-path{font-size:14px;color:var(--muted)} .svp-path a{color:var(--muted)}
.svp h1{margin:0;font-family:'Unbounded',sans-serif;text-transform:uppercase;font-size:36px;line-height:1.1;font-weight:700;color:var(--ink)}
.svp h2{margin:0;font-family:'Unbounded',sans-serif;text-transform:uppercase;font-size:20px;line-height:1.2;font-weight:700;color:var(--ink)}
.svp-lead{margin:12px 0 0;font-size:18px;max-width:680px}
.svp-muted{color:var(--muted)}
.svp-now{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.svp-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.svp .svp-btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;background:var(--accent);color:#fff;text-decoration:none;border:0;cursor:pointer;font-family:'Unbounded',sans-serif;text-transform:uppercase;font-weight:600;font-size:13px;letter-spacing:.06em}
.svp .svp-btn:hover{background:var(--ink);color:#fff}
.svp-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.svp .svp-chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;font:inherit;font-size:15px;cursor:pointer}
.svp .svp-chip.on{background:var(--ink);color:#fff}
.svp-tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--ink)}
.svp-tab{min-height:48px;padding:0;margin-right:28px;border:0;background:none;color:var(--muted);font-family:'Unbounded',sans-serif;font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.svp-tab.on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.svp-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px;padding:16px 0;border-top:1px solid var(--line)}
.svp-row>b{font-family:'Unbounded',sans-serif;text-transform:uppercase;font-size:13px;font-weight:600}
.svp-li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.svp-list{border-bottom:1px solid var(--line)}
.svp ul{margin:0;padding-left:20px;line-height:1.7}
.svp-img{display:block;width:100%;object-fit:cover;background:var(--stone)}
.svp-empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:var(--stone)}
.svp-hide{display:none!important}
@media (max-width:640px){
  .svp{padding:16px 20px 40px}
  .svp-path{font-size:13px}
  .svp h1{font-size:24px;line-height:1.15}
  .svp h2{font-size:16px}
  .svp-lead{font-size:16px}
  .svp .svp-btn{display:flex;width:100%;min-height:52px;padding:0 16px}
  .svp-tab{margin-right:18px;font-size:11px}
  .svp-row{grid-template-columns:minmax(0,1fr);gap:6px;padding:14px 0}
  .svp-li{flex-direction:column;gap:2px}
  .svp .svp-chip{min-height:36px;font-size:14px;padding:0 12px}
}
.cl-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 32px}
.cap-s{font-family:'Unbounded',sans-serif;text-transform:uppercase;font-size:13px;font-weight:600}
.cl-sub{margin-top:20px;padding:20px 24px;background:var(--stone);font-size:15px}
.cl-month{margin-top:32px}
.cl-ev{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:24px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.cl-ev:last-child{border-bottom:1px solid var(--line)}
.cl-d{font-family:'Unbounded',sans-serif;text-transform:uppercase;font-weight:600;font-size:14px}
.cl-tag{font-size:13px;color:var(--muted);white-space:nowrap}
@media (max-width:640px){
  .cl-head .svp-btn{min-height:44px}
  .cl-ev{grid-template-columns:72px minmax(0,1fr);gap:4px 12px}
  .cl-tag{grid-column:2}
  .cl-d{font-size:12px}
}
</style>

<div class="svp svp-cal">
  <div class="cl-head">
    <div><h1>Календарь</h1><p class="svp-lead">Занятия школ, выезды и клубные события в одном месте.</p></div>
    <button type="button" class="svp-btn" id="cl-subbtn" aria-expanded="false">Подписаться</button>
  </div>
  <div class="cl-sub svp-hide" id="cl-sub">
    <b class="cap-s">Подписка на расписание</b>
    <p style="margin:6px 0 0">Скоро здесь будет одна ссылка для Google, Apple или Яндекс Календаря, и изменения будут приходить сами. Пока расписания школ лежат на старом сайте:</p>
    <p style="margin:8px 0 0"><a href="https://westra.ru/activity/schedule-nu.html">Горная НУ</a> · <a href="https://westra.ru/activity/schedule-wbu.html">Горная БУ</a> · <a href="https://westra.ru/activity/alp-calendar.html">Альпинизм</a> · <a href="https://westra.ru/activity/">все направления</a></p>
  </div>
  <div class="svp-chips" style="margin-top:24px" id="cl-f"></div>
  <div id="cl-list"></div>
</div>

<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  /* пока фото не вписаны, вместо них серые прямоугольники */
  document.querySelectorAll('.svp img').forEach(function(im){
    if(/^(https?:|data:|file:)/.test(im.getAttribute('src')||'')) return;
    var d=document.createElement('div'); d.className=im.className+' svp-empty'; d.textContent='фото'; im.parentNode.replaceChild(d,im);
  });

  /* ===== ПРАВИТЬ: ID Google Таблицы с событиями (из ссылки docs.google.com/spreadsheets/d/ЭТОТ_КУСОК/edit).
     Таблица должна быть открыта «всем, у кого есть ссылка» на просмотр. Колонки первой строки:
     Дата | Время | Событие | Место | Метка | Тип  (Дата как 2026-11-24 или 24.11.2026; Тип: школы / клубные / открытые).
     Пока пусто или таблица не открылась, показывается список EVENTS ниже. */
  var SHEET_ID = '1VaxvNKg-Qq0lQI24aSWUwkhhvPA80JX0QRKDvnT5jNE';
  function loadSheet(done){
    if(!SHEET_ID){done(null);return;}
    fetch('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent('События')+'&_='+Math.floor(Date.now()/60000))
      .then(function(r){if(!r.ok)throw r.status;return r.text();})
      .then(function(txt){
        var rows=[],row=[],f='',q=false;
        for(var i=0;i<txt.length;i++){var c=txt[i];
          if(q){ if(c=='"'){ if(txt[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
          else if(c=='"') q=true; else if(c==','){row.push(f);f='';} else if(c=='\n'){row.push(f);rows.push(row);row=[];f='';} else if(c!='\r') f+=c; }
        if(f||row.length){row.push(f);rows.push(row);}
        var out=[];
        rows.slice(1).forEach(function(r){
          var d=(r[0]||'').trim(),m;
          if((m=d.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/))) d=m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
          else if((m=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) d=m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
          else return;
          if(!(r[2]||'').trim()) return;
          out.push({day:d,time:(r[1]||'').trim(),title:r[2].trim(),place:(r[3]||'').trim(),where:[(r[3]||'').trim(),(r[1]||'').trim()].filter(Boolean).join(', '),tag:(r[4]||'').trim(),type:(r[5]||'').trim().toLowerCase()});
        });
        done(out.length?out:null);
      }).catch(function(){done(null);});
  }
  /* ===== ПРАВИТЬ: запасной список событий, если таблица не подключена. day — дата ГГГГ-ММ-ДД, type — школы / клубные / открытые.
     Прошедшие события скрываются сами. */
  var EVENTS = [
    {day:'2026-11-05', time:'чт, 19:00', title:'Экзамен пешеходной школы ПБУ', place:'Зал на Пушкинской', tag:'пешеходная', type:'школы'},
    {day:'2026-11-24', time:'вт, 19:30', title:'Первая встреча школ БУ и СУ', place:'Зал на Пушкинской, Старопименовский пер., 4с2', tag:'открыто всем', type:'открытые'},
    {day:'2026-11-30', time:'[время]', title:'[Лекция горной БУ: тема]', place:'[место или онлайн]', tag:'горная БУ', type:'школы'},
    {day:'2026-12-12', time:'[время]', title:'[Тренировка]', place:'[место]', tag:'горная БУ', type:'школы'},
    {day:'2026-12-19', time:'[время]', title:'[Клубный вечер]', place:'[место]', tag:'клуб', type:'клубные'}
  ];

  var MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var MS=['янв','февр','марта','апр','мая','июня','июля','авг','сент','окт','нояб','дек'];
  var filter='все', fbox=document.getElementById('cl-f');
  fbox.innerHTML=['все','школы','клубные','открытые'].map(function(f){return '<button type="button" class="svp-chip" data-f="'+f+'">'+f+'</button>';}).join('');
  var t=new Date(), today=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2);
  function draw(){
    fbox.querySelectorAll('[data-f]').forEach(function(b){b.classList.toggle('on',b.dataset.f===filter);b.setAttribute('aria-pressed',b.dataset.f===filter);});
    var list=EVENTS.filter(function(e){return e.day>=today&&(filter==='все'||e.type===filter);}).sort(function(a,b){return a.day<b.day?-1:1;});
    if(!list.length){document.getElementById('cl-list').innerHTML='<p class="svp-muted" style="margin-top:24px">Пока ничего не запланировано. Следите за <a href="https://t.me/westra">Телеграмом</a>.</p>';return;}
    var html='', cur='';
    list.forEach(function(e){
      var p=e.day.split('-'), m=MONTHS[+p[1]-1]+' '+p[0];
      if(m!==cur){ if(cur) html+='</div></div>'; html+='<div class="cl-month"><h2>'+m+'</h2><div style="margin-top:8px">'; cur=m; }
      html+='<div class="cl-ev"><span><span class="cl-d">'+(+p[2])+' '+MS[+p[1]-1]+'</span><br><span class="svp-muted" style="font-size:14px">'+esc(e.time)+'</span></span>'+
        '<span><span>'+esc(e.title)+'</span><br><span class="svp-muted" style="font-size:14px">'+esc(e.place)+'</span></span><span class="cl-tag">'+esc(e.tag)+'</span></div>';
    });
    html+='</div></div>';
    document.getElementById('cl-list').innerHTML=html;
  }
  fbox.addEventListener('click',function(e){var b=e.target.closest('[data-f]'); if(b){filter=b.dataset.f; draw();}});
  var sb=document.getElementById('cl-subbtn');
  sb.addEventListener('click',function(){var p=document.getElementById('cl-sub'); var open=p.classList.toggle('svp-hide')===false; sb.setAttribute('aria-expanded',open);});
  draw();
  loadSheet(function(list){ if(list){EVENTS=list; draw();} });
})();
</script>
