<!-- «Связка»: страница «Вести из походов» (адрес /hikes/live/, страница похода /hikes/live/?h=адрес). Вставить в блок T123 «HTML-код», отступы блока 0.
     МАКЕТ: пока на примерах. Потом вести будут браться из таблицы «Связка: вести», походы из листа «Походы». -->
<style>
.svp{--ink:#161615;--muted:#57554F;--line:#E6E4DF;--stone:#ECEAE5;--accent:#C8410B;
  font-family:'Onest',system-ui,sans-serif;font-size:16px;line-height:1.5;color:var(--ink);
  box-sizing:border-box;max-width:956px;padding:24px 48px 64px}
.svp *{box-sizing:border-box}
.svp a{color:var(--ink)} .svp a:hover{color:var(--muted)}
.svp-path{font-size:14px;color:var(--muted);margin-bottom:10px} .svp-path a{color:var(--muted)}
.svp h1{margin:0;font-family:'Unbounded',sans-serif;text-transform:uppercase;font-size:36px;line-height:1.1;font-weight:700}
.svp h2{margin:0;font-family:'Unbounded',sans-serif;text-transform:uppercase;font-size:20px;line-height:1.2;font-weight:700}
.svp-lead{margin:12px 0 0;font-size:18px;max-width:680px}
.svp-muted{color:var(--muted)}
.svp-now{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.svp-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.svp-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.svp .svp-chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;font:inherit;font-size:15px;cursor:pointer}
.svp .svp-chip.on{background:var(--ink);color:#fff}
.svp-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px;padding:12px 0;border-top:1px solid var(--line)}
.svp-row>b{font-family:'Unbounded',sans-serif;text-transform:uppercase;font-size:12px;font-weight:600;padding-top:3px}
.svp-hide{display:none!important}
.lv-sec{margin-top:40px}
.lv-sec>h2{margin-bottom:14px}
.lv-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.svp .lv-card{display:flex;flex-direction:column;gap:6px;padding:18px 20px;border:1px solid var(--ink);text-decoration:none;color:var(--ink)}
.svp .lv-card:hover{background:#FAF9F7;color:var(--ink)}
.lv-k{font-size:13px;color:var(--muted)}
.lv-t{font-family:'Unbounded',sans-serif;text-transform:uppercase;font-weight:700;font-size:17px;line-height:1.2}
.lv-st{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.lv-st i{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.lv-st.prep i{background:none;border:1.5px solid var(--muted)} .lv-st.done i{background:var(--muted)}
.lv-last{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:15px}
.lv-last time{display:block;font-size:13px;color:var(--muted)}
.lv-mini{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:15px}
.lv-feed{border-bottom:1px solid var(--line)}
.lv-msg{display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;padding:14px 0;border-top:1px solid var(--line)}
.lv-msg time{font-size:14px;color:var(--muted);line-height:1.4}
.lv-msg time b{display:block;color:var(--ink);font-weight:600}
.lv-tag{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-bottom:2px;font-size:13px;color:var(--muted)}
.lv-tag a{font-weight:600;color:var(--ink)}
.lv-type{display:inline-flex;align-items:center;gap:6px}
.lv-type.go{color:var(--accent);font-weight:600}
.lv-txt{font-size:16px}
.lv-note{margin-top:40px;padding:18px 20px;background:var(--stone);font-size:15px;max-width:680px}
.lv-note p{margin:0} .lv-note p+p{margin-top:8px}
.lv-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 32px}
.lv-bar{margin-top:20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.lv-prog{flex:1;min-width:200px;height:6px;background:var(--stone);position:relative}
.lv-prog span{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.lv-tl .lv-msg{grid-template-columns:120px 18px minmax(0,1fr);gap:0 16px}
.lv-tl .lv-pin{position:relative}
.lv-tl .lv-pin:before{content:'';position:absolute;left:8px;top:-15px;bottom:-15px;width:1px;background:var(--line)}
.lv-tl .lv-pin:after{content:'';position:absolute;left:4px;top:6px;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid var(--ink)}
.lv-tl .lv-msg.go .lv-pin:after{background:var(--accent);border-color:var(--accent)}
.svp .lv-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--ink);background:#fff;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);text-decoration:none}
@media (max-width:640px){
  .svp{padding:16px 20px 40px}
  .svp-path{font-size:13px}
  .svp h1{font-size:24px;line-height:1.15}
  .svp h2{font-size:16px}
  .svp-lead{font-size:16px}
  .svp-row{grid-template-columns:minmax(0,1fr);gap:2px;padding:10px 0}
  .svp .svp-chip{min-height:36px;font-size:14px;padding:0 12px}
  .lv-sec{margin-top:32px}
  .lv-cards{grid-template-columns:minmax(0,1fr)}
  .svp .lv-card{padding:16px}
  .lv-msg{grid-template-columns:minmax(0,1fr);gap:4px;padding:12px 0}
  .lv-msg time b{display:inline;margin-right:6px}
  .lv-tl .lv-msg{grid-template-columns:18px minmax(0,1fr);gap:2px 12px}
  .lv-tl .lv-msg time{grid-column:2} .lv-tl .lv-pin{grid-row:1/3;grid-column:1} .lv-tl .lv-body{grid-column:2}
  .lv-chips-scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:0 20px}
  .lv-chips-scroll .svp-chip{flex:none}
}
</style>

<div class="svp svp-live"></div>

<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  /* ===== МАКЕТ: примеры. Потом: походы из листа «Походы», вести из таблицы «Связка: вести». */
  var NOW = new Date(2027,6,18,20,15); /* для макета «сейчас» = 18 июля 2027, 20:15 */
  var HIKES = [
    {id:'svanetiya-27', title:'Сванетия', kind:'горный', ks:'3', area:'Кавказ, Грузия', from:'2027-07-06', to:'2027-07-24', leader:'Андрей Иванов', curator:'Ольга', status:'go', route:'Местиа — пер. Твибер — лед. Цанери — пер. Цаннер — Ушгули'},
    {id:'altai-27', title:'Северо-Чуйский хребет', kind:'горный', ks:'2', area:'Алтай', from:'2027-07-10', to:'2027-07-25', leader:'Мария Смирнова', curator:'Дмитрий', status:'go', route:'Актру — пер. Учитель — оз. Шавлинские — Чибит'},
    {id:'pamir-27', title:'Памир, Заалайский хребет', kind:'горный', ks:'4', area:'Памир, Киргизия', from:'2027-07-01', to:'2027-07-28', leader:'Сергей Кузнецов', curator:'Елена', status:'go', route:'Ачик-Таш — пер. Путешественников — лед. Ленина — Дароот-Коргон'},
    {id:'karelia-27', title:'Река Чирка-Кемь', kind:'водный', ks:'2', area:'Карелия', from:'2027-07-12', to:'2027-07-21', leader:'Павел Орлов', curator:'Анна', status:'go', route:'пос. Тикша — Чирка-Кемь — Кемь — пос. Юшкозеро'},
    {id:'fany-27', title:'Фанские горы', kind:'горный', ks:'1', area:'Таджикистан', from:'2027-07-22', to:'2027-08-03', leader:'Ирина Волкова', curator:'Максим', status:'prep', route:'Артуч — оз. Куликалон — пер. Алаудин — Искандеркуль', school:'НУ'},
    {id:'khibiny-27', title:'Хибины', kind:'пешеходный', ks:'1', area:'Кольский п-ов', from:'2027-07-03', to:'2027-07-12', leader:'Николай Петров', curator:'Татьяна', status:'done', route:'Кировск — пер. Юмъекорр — Умбозеро — Кировск'}
  ];
  /* type: start · ok (на связи, всё хорошо) · point (прошли точку) · delay (задержка) · finish */
  var TYPES = {start:'Стартовали', ok:'На связи, всё хорошо', point:'Прошли точку', delay:'Задержка', finish:'Финишировали'};
  var NEWS = [
    {h:'svanetiya-27', t:'2027-07-18 19:40', type:'point', text:'Прошли пер. Твибер, стоим под ледником. Все хорошо, погода ясная.'},
    {h:'altai-27', t:'2027-07-18 17:05', type:'ok', text:'Стоим на оз. Шавлинские, сегодня полудневка. Все здоровы, передают привет.'},
    {h:'karelia-27', t:'2027-07-18 12:30', type:'point', text:'Прошли порог Хаута, ночуем ниже. Все в порядке.'},
    {h:'svanetiya-27', t:'2027-07-17 21:10', type:'ok', text:'Ночёвка у озера под перевалом. Завтра штурм. Все бодры.'},
    {h:'pamir-27', t:'2027-07-17 09:15', type:'delay', text:'Сидим вторые сутки из-за непогоды на леднике. Продукты есть, все в порядке, ждём окно. Финиш может сдвинуться на 1–2 дня.'},
    {h:'altai-27', t:'2027-07-16 20:00', type:'point', text:'Прошли пер. Учитель (2А). Спустились к озёрам.'},
    {h:'svanetiya-27', t:'2027-07-16 18:20', type:'ok', text:'Дошли до лед. Цанери, встали лагерем.'},
    {h:'khibiny-27', t:'2027-07-12 16:00', type:'finish', text:'Группа вышла в Кировск. Поход завершён, все дома 13 июля.'},
    {h:'karelia-27', t:'2027-07-12 15:40', type:'start', text:'Стартовали из Тикши, первая ночёвка на берегу.'},
    {h:'svanetiya-27', t:'2027-07-06 14:00', type:'start', text:'Выехали из Местиа, начали маршрут. Связь будет раз в день вечером.'}
  ];

  var MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var MONS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  function pd(s){var m=s.match(/(\d+)-(\d+)-(\d+)(?:\s+(\d+):(\d+))?/); return new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));}
  function day(d){var a=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()), b=new Date(d.getFullYear(),d.getMonth(),d.getDate()), n=Math.round((a-b)/864e5);
    return n===0?'сегодня':n===1?'вчера':d.getDate()+' '+MON[d.getMonth()];}
  function hm(d){return d.getHours()+':'+('0'+d.getMinutes()).slice(-2);}
  function ago(d){var m=Math.round((NOW-d)/6e4); if(m<60) return m+' мин назад'; var h=Math.round(m/60); if(h<24) return h+' '+(h%10==1&&h!=11?'час':(h%10>=2&&h%10<=4&&(h<10||h>20))?'часа':'часов')+' назад'; return day(d);}
  function range(x){var a=pd(x.from),b=pd(x.to); return a.getDate()+(a.getMonth()!=b.getMonth()?' '+MONS[a.getMonth()]:'')+' — '+b.getDate()+' '+MONS[b.getMonth()];}
  function hike(id){for(var i=0;i<HIKES.length;i++) if(HIKES[i].id===id) return HIKES[i]; return null;}
  function news(id){return NEWS.filter(function(n){return !id||n.h===id;}).sort(function(a,b){return pd(b.t)-pd(a.t);});}
  var ST = {go:'на маршруте', prep:'готовятся', done:'финишировали'};
  function st(x){return '<span class="lv-st '+x.status+'"><i></i>'+ST[x.status]+'</span>';}
  function link(x){return '?h='+encodeURIComponent(x.id);}
  function msg(n, withTag, tl){
    var d=pd(n.t), x=hike(n.h)||{}, go=n.type==='start'||n.type==='finish';
    return '<div class="lv-msg'+(go?' go':'')+'"><time datetime="'+esc(n.t)+'"><b>'+day(d)+'</b>'+hm(d)+'</time>'+(tl?'<div class="lv-pin"></div>':'')+
      '<div class="lv-body"><div class="lv-tag">'+(withTag?'<a href="'+link(x)+'">'+esc(x.title)+'</a>':'')+'<span class="lv-type'+(go?' go':'')+'">'+TYPES[n.type]+'</span></div>'+
      '<div class="lv-txt">'+esc(n.text)+'</div></div></div>';
  }
  var root=document.querySelector('.svp-live');

  function overview(){
    var going=HIKES.filter(function(x){return x.status==='go';}), prep=HIKES.filter(function(x){return x.status==='prep';}), done=HIKES.filter(function(x){return x.status==='done';});
    var h='<div class="svp-path"><a href="/hikes/">Походы</a> › Вести из походов</div>'+
      '<h1>Вести из походов</h1>'+
      '<p class="svp-lead">Где сейчас наши группы. Кураторы пересказывают здесь СМС со спутникового телефона, обычно раз в день.</p>'+
      '<div class="lv-sec"><div class="svp-now" style="margin-bottom:14px"><span class="svp-dot"></span>Сейчас на маршруте: '+going.length+'</div><div class="lv-cards">'+
      going.map(function(x){var last=news(x.id)[0];
        return '<a class="lv-card" href="'+link(x)+'"><span class="lv-k">'+esc(x.kind)+', '+esc(x.ks)+' к.с. · '+esc(x.area)+'</span><span class="lv-t">'+esc(x.title)+'</span>'+
          '<span class="lv-k">'+range(x)+' · рук. '+esc(x.leader)+'</span>'+
          (last?'<span class="lv-last"><time>последняя весть '+ago(pd(last.t))+'</time>'+esc(last.text)+'</span>':'')+'</a>';
      }).join('')+'</div></div>'+
      (prep.length?'<div class="lv-sec"><h2>Скоро выходят</h2><div class="lv-feed" style="margin-top:4px">'+prep.map(function(x){
        return '<div class="svp-row"><b>'+range(x)+'</b><div><a href="'+link(x)+'">'+esc(x.title)+'</a> <span class="svp-muted">· '+esc(x.kind)+', '+esc(x.ks)+' к.с. · рук. '+esc(x.leader)+'</span></div></div>';}).join('')+'</div></div>':'')+
      '<div class="lv-sec"><h2>Все вести</h2><div class="svp-chips lv-chips-scroll" style="margin:4px 0 16px" id="lv-f"><button type="button" class="svp-chip on" data-h="">все походы</button>'+
      HIKES.filter(function(x){return x.status!=='prep';}).map(function(x){return '<button type="button" class="svp-chip" data-h="'+esc(x.id)+'">'+esc(x.title)+'</button>';}).join('')+
      '</div><div class="lv-feed" id="lv-feed"></div></div>'+
      (done.length?'<div class="lv-sec"><h2>Вернулись в этом сезоне</h2><div class="lv-feed" style="margin-top:4px">'+done.map(function(x){
        return '<div class="svp-row"><b>'+range(x)+'</b><div><a href="'+link(x)+'">'+esc(x.title)+'</a> <span class="svp-muted">· '+esc(x.kind)+', '+esc(x.ks)+' к.с. · все вести →</span></div></div>';}).join('')+'</div></div>':'')+
      note();
    root.innerHTML=h;
    function feed(id){document.getElementById('lv-feed').innerHTML=news(id).map(function(n){return msg(n,!id,false);}).join('');}
    feed('');
    document.getElementById('lv-f').addEventListener('click',function(e){var b=e.target.closest('[data-h]'); if(!b) return;
      this.querySelectorAll('[data-h]').forEach(function(c){c.classList.toggle('on',c===b);}); feed(b.dataset.h);});
  }
  function note(){
    return '<div class="lv-note"><p><b>Если вестей давно нет</b>, это почти всегда значит, что нет связи: спутниковый телефон включают раз в день или реже, в ущельях он не ловит.</p>'+
      '<p>Важное о конкретном человеке куратор сообщает родственникам лично, здесь его не публикуют. Вопросы о группе задавайте куратору или руководителю.</p></div>';
  }
  function page(x){
    var list=news(x.id), last=list[0];
    var a=pd(x.from), b=pd(x.to), total=Math.round((b-a)/864e5)+1, cur=Math.min(total,Math.max(0,Math.floor((NOW-a)/864e5)+1));
    var bar = x.status==='go'?'<div class="lv-bar">'+st(x)+'<span class="svp-muted" style="font-size:14px">день '+cur+' из '+total+'</span><div class="lv-prog"><span style="width:'+Math.round(cur/total*100)+'%"></span></div></div>'
      :'<div class="lv-bar">'+st(x)+'</div>';
    root.innerHTML='<div class="svp-path"><a href="/hikes/">Походы</a> › <a href="./">Вести из походов</a> › '+esc(x.title)+'</div>'+
      '<h1>'+esc(x.title)+'</h1>'+bar+
      '<div style="margin-top:24px;border-bottom:1px solid var(--line)">'+
      '<div class="svp-row"><b>Поход</b><div>'+esc(x.kind)+', '+esc(x.ks)+' к.с. · '+esc(x.area)+'</div></div>'+
      '<div class="svp-row"><b>Сроки</b><div>'+range(x)+' '+b.getFullYear()+'</div></div>'+
      '<div class="svp-row"><b>Маршрут</b><div>'+esc(x.route)+'</div></div>'+
      '<div class="svp-row"><b>Руководитель</b><div>'+esc(x.leader)+'</div></div>'+
      '<div class="svp-row"><b>Куратор</b><div>'+esc(x.curator)+' <span class="svp-muted">· на связи с группой и пишет сюда вести</span></div></div></div>'+
      '<div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:8px"><button type="button" class="lv-btn" id="lv-copy">Скопировать ссылку для родных</button><a class="lv-btn" href="./">Все походы</a></div>'+
      '<div class="lv-sec"><h2>Вести'+(last?' <span class="svp-muted" style="font-family:Onest,sans-serif;text-transform:none;font-weight:400;font-size:15px">· последняя '+ago(pd(last.t))+'</span>':'')+'</h2>'+
      '<div class="lv-feed lv-tl" style="margin-top:4px">'+(list.length?list.map(function(n){return msg(n,false,true);}).join(''):'<p class="svp-muted">Вестей пока нет. Первая появится, когда группа выйдет на маршрут.</p>')+'</div></div>'+
      note();
    document.getElementById('lv-copy').addEventListener('click',function(){try{navigator.clipboard.writeText(location.href);this.textContent='Ссылка скопирована';}catch(e){}});
  }
  var id=(location.search.match(/[?&]h=([^&]+)/)||[])[1], x=id&&hike(decodeURIComponent(id));
  if(x) page(x); else overview();
})();
</script>
